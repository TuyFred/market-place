# AFROLUXO BY ASI — backend on Render
# After first deploy, copy the service URL into vercel.json rewrites
# and set CORS_ORIGIN to your Vercel domain (e.g. https://afroluxo.vercel.app)
services:
  - type: web
    name: afroluxo-by-asi-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
